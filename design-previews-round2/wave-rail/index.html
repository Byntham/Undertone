<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undertone — Wave Rail</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        font-synthesis: none;
        --accent: 126 211 220;
        --stage-edge: 28px;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 320px;
        min-height: 460px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #edf4f5;
        background:
          radial-gradient(circle at 18% 8%, rgb(69 122 127 / 0.48), transparent 35%),
          radial-gradient(circle at 84% 80%, rgb(33 71 96 / 0.48), transparent 38%),
          linear-gradient(145deg, #142c31 0%, #0c1921 48%, #080d14 100%);
      }

      button { font: inherit; }

      .desktop {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
        overflow: hidden;
      }

      .desktop::before {
        position: absolute;
        inset: 0;
        z-index: -4;
        content: "";
        opacity: 0.48;
        background:
          linear-gradient(rgb(255 255 255 / 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.025) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, #000 18%, transparent 76%);
      }

      .ambient {
        position: absolute;
        width: 420px;
        height: 420px;
        border: 1px solid rgb(166 238 241 / 0.08);
        border-radius: 44% 56% 62% 38% / 52% 37% 63% 48%;
        filter: blur(1px);
        transform: rotate(28deg);
      }

      .ambient.one { left: -190px; bottom: -180px; }
      .ambient.two { top: -245px; right: -160px; transform: rotate(75deg) scale(1.25); }

      .concept {
        position: absolute;
        top: 24px;
        left: var(--stage-edge);
        z-index: 12;
        display: grid;
        gap: 4px;
        user-select: none;
      }

      .concept strong {
        color: rgb(237 248 249 / 0.92);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .concept span {
        color: rgb(215 232 235 / 0.52);
        font-size: 12px;
      }

      .ghost-app {
        position: absolute;
        left: 50%;
        top: 13%;
        z-index: -2;
        width: min(760px, calc(100% - 72px));
        height: 58%;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.065);
        border-radius: 17px;
        background: rgb(4 10 15 / 0.28);
        box-shadow: 0 30px 100px rgb(0 0 0 / 0.22);
        transform: translateX(-50%);
        backdrop-filter: blur(3px);
      }

      .ghost-app::before {
        display: block;
        height: 38px;
        content: "";
        border-bottom: 1px solid rgb(255 255 255 / 0.05);
        background:
          radial-gradient(circle at 18px 50%, rgb(255 255 255 / 0.12) 0 2px, transparent 2.5px),
          radial-gradient(circle at 32px 50%, rgb(255 255 255 / 0.1) 0 2px, transparent 2.5px),
          radial-gradient(circle at 46px 50%, rgb(255 255 255 / 0.08) 0 2px, transparent 2.5px);
      }

      .ghost-copy {
        width: min(540px, calc(100% - 54px));
        margin: 42px auto;
      }

      .ghost-copy i {
        display: block;
        width: var(--w);
        height: 7px;
        margin-bottom: 15px;
        border-radius: 99px;
        background: rgb(218 235 238 / 0.055);
      }

      .mount {
        position: absolute;
        left: calc(50% - 270px);
        top: calc(50% - 48px);
        z-index: 10;
        width: 540px;
        height: 96px;
        max-width: calc(100% - 32px);
        touch-action: none;
      }

      .turn-shell {
        position: absolute;
        left: 0;
        top: 0;
        width: 540px;
        height: 96px;
        max-width: 100%;
        min-width: 54px;
        min-height: 54px;
        overflow: hidden;
        border: 1px solid rgb(207 246 246 / 0.13);
        border-radius: 20px;
        background:
          linear-gradient(122deg, rgb(255 255 255 / 0.06), transparent 31%, rgb(146 223 226 / 0.035) 60%, rgb(255 255 255 / 0.04)),
          linear-gradient(150deg, rgb(17 31 36 / 0.97), rgb(7 14 20 / 0.965));
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.09) inset,
          0 -1px 0 rgb(0 0 0 / 0.34) inset,
          0 22px 54px rgb(0 4 8 / 0.42),
          0 5px 14px rgb(0 4 8 / 0.27);
        transform-origin: left center;
        transition:
          width 520ms cubic-bezier(0.22, 0.86, 0.26, 1),
          height 480ms cubic-bezier(0.22, 0.86, 0.26, 1),
          border-radius 420ms ease,
          opacity 180ms ease,
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
        backdrop-filter: blur(30px) saturate(1.3);
      }

      .turn-shell.compact {
        width: 54px;
        height: 54px;
        border-radius: 18px;
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.12) inset,
          0 14px 34px rgb(0 4 8 / 0.4),
          0 0 30px rgb(var(--accent) / 0.09);
      }

      .turn-shell.processing { width: 74px; }

      .turn-shell.dismissed {
        pointer-events: none;
        opacity: 0;
        transform: translateY(7px) scale(0.975);
      }

      .turn-shell:hover,
      .turn-shell:focus-within {
        border-color: rgb(211 248 249 / 0.22);
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.11) inset,
          0 -1px 0 rgb(0 0 0 / 0.35) inset,
          0 26px 66px rgb(0 4 8 / 0.47),
          0 6px 18px rgb(0 4 8 / 0.3);
      }

      .liquid-field {
        position: absolute;
        inset: -12px;
        z-index: 0;
        width: calc(100% + 24px);
        height: calc(100% + 24px);
        pointer-events: none;
        opacity: 0.7;
      }

      .caustic {
        position: absolute;
        z-index: 0;
        pointer-events: none;
        border-radius: 47% 53% 61% 39% / 48% 37% 63% 52%;
        mix-blend-mode: screen;
        filter: blur(10px);
        opacity: 0.25;
      }

      .caustic.a {
        left: 20px;
        top: -45px;
        width: 210px;
        height: 118px;
        background: radial-gradient(ellipse at 50% 100%, rgb(131 236 236 / 0.32), transparent 67%);
        transform: rotate(-9deg);
      }

      .caustic.b {
        right: 34px;
        bottom: -72px;
        width: 250px;
        height: 125px;
        background: radial-gradient(ellipse at 45% 0%, rgb(87 119 183 / 0.32), transparent 70%);
        transform: rotate(8deg);
      }

      .wave-rail {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 4;
        display: grid;
        width: 54px;
        height: 100%;
        padding: 0;
        place-items: center;
        border: 0;
        border-right: 1px solid rgb(221 251 251 / 0.07);
        background:
          radial-gradient(circle at 34% 28%, rgb(190 255 252 / 0.1), transparent 36%),
          linear-gradient(180deg, rgb(var(--accent) / 0.055), rgb(255 255 255 / 0.012));
        color: inherit;
        cursor: grab;
      }

      .compact .wave-rail { border-right-color: transparent; }
      .wave-rail:active { cursor: grabbing; }

      .wave-rail::after {
        position: absolute;
        right: -1px;
        top: 16px;
        bottom: 16px;
        width: 1px;
        content: "";
        background: linear-gradient(transparent, rgb(var(--accent) / 0.42), transparent);
        opacity: 0.6;
        transition: opacity 180ms ease;
      }

      .compact .wave-rail::after { opacity: 0; }

      .bars {
        display: flex;
        width: 28px;
        height: 32px;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }

      .bars i {
        width: 3px;
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(to bottom, rgb(202 255 251 / 0.96), rgb(var(--accent) / 0.72));
        box-shadow: 0 0 7px rgb(var(--accent) / 0.2);
        transition: height 65ms linear, opacity 120ms ease, transform 120ms ease;
      }

      .processing .bars i {
        height: 5px !important;
        animation: process-wave 840ms ease-in-out infinite;
      }

      .processing .bars i:nth-child(2) { animation-delay: 70ms; }
      .processing .bars i:nth-child(3) { animation-delay: 140ms; }
      .processing .bars i:nth-child(4) { animation-delay: 210ms; }
      .processing .bars i:nth-child(5) { animation-delay: 280ms; }

      .settled .bars i {
        height: var(--rest) !important;
        opacity: 0.5;
      }

      .transcript-wrap {
        position: absolute;
        inset: 0 0 0 54px;
        z-index: 2;
        overflow: hidden;
        opacity: 1;
        transition: opacity 180ms ease 190ms, transform 420ms cubic-bezier(0.22, 0.86, 0.26, 1) 120ms;
      }

      .compact .transcript-wrap {
        opacity: 0;
        transform: translateX(-12px);
        transition-delay: 0ms;
      }

      .transcript-wrap::after {
        position: absolute;
        right: 0;
        top: 0;
        z-index: 3;
        width: 94px;
        height: 52px;
        content: "";
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgb(8 16 21 / 0.94) 65%);
        opacity: 0;
        transition: opacity 130ms ease;
      }

      .turn-shell:hover .transcript-wrap::after,
      .turn-shell:focus-within .transcript-wrap::after { opacity: 1; }

      .transcript {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 17px 24px 16px 20px;
        overflow-x: hidden;
        overflow-y: auto;
        color: rgb(244 249 249 / 0.95);
        font-size: 14px;
        font-weight: 430;
        line-height: 21px;
        letter-spacing: -0.006em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        scrollbar-color: rgb(196 230 232 / 0.2) transparent;
        scrollbar-width: thin;
      }

      .transcript::-webkit-scrollbar { width: 5px; }
      .transcript::-webkit-scrollbar-track { background: transparent; }
      .transcript::-webkit-scrollbar-thumb {
        border-radius: 99px;
        background: rgb(196 230 232 / 0.2);
      }

      .actions {
        position: absolute;
        top: 9px;
        right: 10px;
        z-index: 7;
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 3px;
        border: 1px solid rgb(226 250 249 / 0.09);
        border-radius: 11px;
        background: rgb(7 14 18 / 0.72);
        box-shadow: 0 7px 18px rgb(0 0 0 / 0.2);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px) scale(0.97);
        transition: opacity 130ms ease, transform 150ms ease;
        backdrop-filter: blur(18px);
      }

      .turn-shell:not(.compact):hover .actions,
      .turn-shell:not(.compact):focus-within .actions {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      .action {
        display: grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: rgb(213 229 231 / 0.68);
        cursor: pointer;
        transition: color 120ms ease, background 120ms ease, transform 90ms ease;
      }

      .action:hover {
        color: rgb(245 251 251 / 0.98);
        background: rgb(220 250 249 / 0.09);
      }

      .action:active { transform: scale(0.92); }
      .action svg { width: 15px; height: 15px; }

      .action.discard:hover {
        color: rgb(255 178 186 / 0.98);
        background: rgb(238 91 108 / 0.16);
      }

      .action:focus-visible,
      .demo-button:focus-visible,
      .wave-rail:focus-visible,
      .resize-handle:focus-visible {
        outline: 2px solid rgb(var(--accent) / 0.9);
        outline-offset: 1px;
      }

      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 8;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: nwse-resize;
        opacity: 0;
        transition: opacity 130ms ease;
      }

      .resize-handle::before,
      .resize-handle::after {
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 7px;
        height: 1px;
        content: "";
        background: rgb(221 242 243 / 0.58);
        transform: rotate(-45deg);
        transform-origin: right center;
      }

      .resize-handle::after { bottom: 9px; width: 3px; }

      .turn-shell:not(.compact):hover .resize-handle,
      .turn-shell:not(.compact):focus-within .resize-handle { opacity: 0.74; }

      .phase {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 14px);
        color: rgb(218 235 236 / 0.5);
        font-size: 11px;
        text-align: left;
        opacity: 1;
        transition: opacity 140ms ease;
        user-select: none;
      }

      .demo-dock {
        position: absolute;
        left: 50%;
        bottom: 28px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        border: 1px solid rgb(224 249 249 / 0.13);
        border-radius: 14px;
        background: rgb(5 12 17 / 0.66);
        box-shadow: 0 12px 34px rgb(0 0 0 / 0.24);
        transform: translateX(-50%);
        backdrop-filter: blur(22px) saturate(1.25);
      }

      .demo-dock::before {
        padding: 0 8px 0 6px;
        content: "Preview";
        color: rgb(222 238 240 / 0.45);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .demo-button {
        height: 29px;
        padding: 0 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: rgb(223 238 239 / 0.65);
        font-size: 11px;
        cursor: pointer;
      }

      .demo-button:hover {
        color: rgb(246 251 251 / 0.97);
        background: rgb(227 252 250 / 0.07);
      }

      .demo-button[aria-pressed="true"] {
        color: rgb(239 252 251 / 0.96);
        background: rgb(var(--accent) / 0.15);
        box-shadow: 0 0 0 1px rgb(var(--accent) / 0.12) inset;
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 80px;
        z-index: 25;
        padding: 8px 11px;
        border: 1px solid rgb(225 250 250 / 0.1);
        border-radius: 10px;
        background: rgb(6 13 18 / 0.78);
        color: rgb(230 242 243 / 0.78);
        font-size: 11px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 5px);
        transition: opacity 150ms ease, transform 150ms ease;
        backdrop-filter: blur(18px);
      }

      .toast.visible { opacity: 1; transform: translate(-50%, 0); }

      @keyframes process-wave {
        0%, 58%, 100% { opacity: 0.3; transform: translateY(0) scaleY(0.65); }
        26% { opacity: 1; transform: translateY(-2px) scaleY(1.55); }
      }

      @media (max-width: 620px) {
        :root { --stage-edge: 16px; }
        .concept span { display: none; }
        .mount { left: 16px; width: calc(100% - 32px); }
        .turn-shell { width: 100%; }
        .demo-dock::before { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="desktop" id="desktop" aria-label="Undertone Wave Rail design preview">
      <span class="ambient one" aria-hidden="true"></span>
      <span class="ambient two" aria-hidden="true"></span>

      <div class="concept">
        <strong>Wave rail</strong>
        <span>The recording indicator becomes the draft’s edge.</span>
      </div>

      <div class="ghost-app" aria-hidden="true">
        <div class="ghost-copy">
          <i style="--w: 42%"></i><i style="--w: 92%"></i><i style="--w: 84%"></i><i style="--w: 89%"></i><i style="--w: 64%"></i>
        </div>
      </div>

      <div class="mount" id="mount">
        <section class="turn-shell compact recording" id="turnShell" aria-label="Open turn preview">
          <svg class="liquid-field" viewBox="0 0 600 130" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="liquid-glint" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#c5ffff" stop-opacity="0.18" />
                <stop offset="0.34" stop-color="#78d5d8" stop-opacity="0.035" />
                <stop offset="0.7" stop-color="#8398d2" stop-opacity="0.09" />
                <stop offset="1" stop-color="#e9ffff" stop-opacity="0.025" />
              </linearGradient>
              <filter id="liquid-distort" x="-15%" y="-30%" width="130%" height="160%">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.028" numOctaves="2" seed="8" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="B" />
                <feGaussianBlur stdDeviation="1.4" />
              </filter>
            </defs>
            <path d="M-22 80 C78 7 137 114 248 42 S422 13 638 74 L638 -10 L-22 -10 Z" fill="url(#liquid-glint)" filter="url(#liquid-distort)" />
            <path d="M-15 110 C99 47 193 121 302 73 S470 48 624 103" fill="none" stroke="#bff8f7" stroke-opacity="0.065" stroke-width="2" filter="url(#liquid-distort)" />
          </svg>
          <span class="caustic a" aria-hidden="true"></span>
          <span class="caustic b" aria-hidden="true"></span>

          <button class="wave-rail" id="dragRail" type="button" aria-label="Drag open turn window">
            <span class="bars" aria-hidden="true">
              <i style="--rest: 6px"></i><i style="--rest: 12px"></i><i style="--rest: 18px"></i><i style="--rest: 10px"></i><i style="--rest: 7px"></i>
            </span>
          </button>

          <div class="transcript-wrap">
            <div class="transcript" id="transcript" role="textbox" aria-readonly="true">This is what the turn window looks like right now. The voice indicator now becomes the edge of the open turn.</div>
          </div>

          <div class="actions" aria-label="Window actions">
            <button class="action" id="snap" type="button" aria-label="Move to default position">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <circle cx="10" cy="10" r="5.2" stroke="currentColor" stroke-width="1.35" />
                <circle cx="10" cy="10" r="1.65" fill="currentColor" />
                <path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
              </svg>
            </button>
            <button class="action discard" id="discard" type="button" aria-label="Discard open turn">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M5.7 6.6l.55 9.05h7.5l.55-9.05M4.5 5h11M8 5V3.5h4V5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M8.25 8.5v4.7M11.75 8.5v4.7" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" />
              </svg>
            </button>
          </div>

          <button class="resize-handle" id="resizeHandle" type="button" aria-label="Resize open turn window"></button>
        </section>
        <div class="phase" id="phase" aria-live="polite">Recording — the window begins as the existing voice indicator</div>
      </div>

      <nav class="demo-dock" aria-label="Preview controls">
        <button class="demo-button" id="replay" type="button">Replay transition</button>
        <button class="demo-button" id="speakAgain" type="button" aria-pressed="false">Speak again</button>
        <button class="demo-button" id="longText" type="button" aria-pressed="false">Long text</button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script>
      (() => {
        const desktop = document.querySelector("#desktop");
        const mount = document.querySelector("#mount");
        const shell = document.querySelector("#turnShell");
        const rail = document.querySelector("#dragRail");
        const bars = [...document.querySelectorAll(".bars i")];
        const transcript = document.querySelector("#transcript");
        const phase = document.querySelector("#phase");
        const replay = document.querySelector("#replay");
        const speakAgain = document.querySelector("#speakAgain");
        const longText = document.querySelector("#longText");
        const snap = document.querySelector("#snap");
        const discard = document.querySelector("#discard");
        const resizeHandle = document.querySelector("#resizeHandle");
        const toast = document.querySelector("#toast");

        const shortCopy = "This is what the turn window looks like right now. The voice indicator now becomes the edge of the open turn.";
        const longCopy = "This is what the turn window looks like right now. The voice indicator now becomes the edge of the open turn, so recording and reviewing feel like one continuous action. Additional fragments stay in this same quiet surface while the words remain the visual priority. The rail continues to react when I speak again, the newest text stays in view, and the window can still be moved, resized, snapped back, or discarded without adding permanent interface chrome.";

        let envelope = 0;
        let history = bars.map(() => 0);
        let frame;
        let replayTimers = [];
        let dragState = null;
        let resizeState = null;
        let toastTimer;
        let voiceActive = true;
        let longActive = false;

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function clearReplayTimers() {
          replayTimers.forEach(window.clearTimeout);
          replayTimers = [];
        }

        function stageMessage(message) {
          phase.textContent = message;
        }

        function showToast(message) {
          window.clearTimeout(toastTimer);
          toast.textContent = message;
          toast.classList.add("visible");
          toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 1500);
        }

        function setVoice(active) {
          voiceActive = active;
          shell.classList.toggle("recording", active);
          shell.classList.toggle("settled", !active && !shell.classList.contains("processing"));
          speakAgain.setAttribute("aria-pressed", String(active && !shell.classList.contains("compact")));
        }

        function renderVoice(now) {
          if (voiceActive && !shell.classList.contains("processing")) {
            const talk = 0.5 + 0.5 * Math.sin(now / 225);
            const syllable = Math.max(0, Math.sin(now / 91) * 0.62 + Math.sin(now / 47) * 0.24 + 0.2);
            const target = (0.13 + 0.87 * syllable) * (0.58 + 0.42 * talk);
            envelope = target > envelope ? envelope * 0.18 + target * 0.82 : envelope * 0.72 + target * 0.28;
            history.pop();
            history.unshift(envelope);
            bars.forEach((bar, index) => {
              const level = history[index] ?? 0;
              const shape = index === 2 ? 1 : index === 1 || index === 3 ? 0.82 : 0.62;
              bar.style.height = Math.round(4 + level * 24 * shape) + "px";
            });
          }
          frame = window.requestAnimationFrame(renderVoice);
        }

        function defaultPosition() {
          const width = mount.offsetWidth;
          const height = mount.offsetHeight;
          return {
            left: Math.max(16, Math.round((desktop.clientWidth - width) / 2)),
            top: Math.max(96, Math.round((desktop.clientHeight - height) / 2) - 8)
          };
        }

        function snapHome(announce = true) {
          const home = defaultPosition();
          mount.style.left = home.left + "px";
          mount.style.top = home.top + "px";
          if (announce) showToast("Returned to default position");
        }

        function finishExpansion() {
          shell.classList.remove("compact", "processing");
          shell.classList.add("settled");
          setVoice(false);
          stageMessage("Open turn — hover for controls; press “Speak again” to reactivate the rail");
        }

        function runReplay() {
          clearReplayTimers();
          longActive = false;
          longText.setAttribute("aria-pressed", "false");
          transcript.textContent = shortCopy;
          mount.style.removeProperty("width");
          mount.style.removeProperty("height");
          shell.className = "turn-shell compact recording";
          shell.style.removeProperty("width");
          shell.style.removeProperty("height");
          shell.classList.remove("dismissed");
          setVoice(true);
          replay.disabled = true;
          stageMessage("Recording — the window begins as the existing voice indicator");
          snapHome(false);

          const transcribeDelay = reducedMotion ? 220 : 1450;
          const expandDelay = reducedMotion ? 460 : 2350;
          const settleDelay = reducedMotion ? 700 : 3050;

          replayTimers.push(window.setTimeout(() => {
            setVoice(false);
            shell.classList.remove("recording", "settled");
            shell.classList.add("processing");
            stageMessage("Transcribing — the same indicator shifts state before the draft exists");
          }, transcribeDelay));

          replayTimers.push(window.setTimeout(() => {
            shell.classList.remove("compact", "processing");
            shell.classList.add("settled");
            stageMessage("The transcript grows horizontally from the voice rail");
          }, expandDelay));

          replayTimers.push(window.setTimeout(() => {
            finishExpansion();
            replay.disabled = false;
          }, settleDelay));
        }

        replay.addEventListener("click", runReplay);

        speakAgain.addEventListener("click", () => {
          if (shell.classList.contains("compact") || shell.classList.contains("dismissed")) return;
          const next = !voiceActive;
          setVoice(next);
          stageMessage(next
            ? "Recording another fragment — the embedded rail is RMS-reactive"
            : "Open turn — hover for controls; press “Speak again” to reactivate the rail");
        });

        longText.addEventListener("click", () => {
          if (shell.classList.contains("compact") || shell.classList.contains("dismissed")) return;
          longActive = !longActive;
          longText.setAttribute("aria-pressed", String(longActive));
          transcript.textContent = longActive ? longCopy : shortCopy;
          if (longActive) {
            shell.style.height = "154px";
            mount.style.height = "154px";
          } else {
            shell.style.height = "96px";
            mount.style.height = "96px";
          }
          window.requestAnimationFrame(() => { transcript.scrollTop = transcript.scrollHeight; });
        });

        snap.addEventListener("pointerdown", (event) => event.stopPropagation());
        snap.addEventListener("click", () => snapHome(true));

        discard.addEventListener("pointerdown", (event) => event.stopPropagation());
        discard.addEventListener("click", () => {
          clearReplayTimers();
          shell.classList.add("dismissed");
          setVoice(false);
          replay.disabled = false;
          stageMessage("Turn discarded — replay restores the preview");
          showToast("Turn discarded");
        });

        rail.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          const bounds = mount.getBoundingClientRect();
          const desktopBounds = desktop.getBoundingClientRect();
          dragState = {
            x: event.clientX,
            y: event.clientY,
            left: bounds.left - desktopBounds.left,
            top: bounds.top - desktopBounds.top
          };
          rail.setPointerCapture(event.pointerId);
        });

        rail.addEventListener("pointermove", (event) => {
          if (!dragState) return;
          const maxLeft = desktop.clientWidth - mount.offsetWidth;
          const maxTop = desktop.clientHeight - mount.offsetHeight - 76;
          mount.style.left = Math.max(0, Math.min(maxLeft, dragState.left + event.clientX - dragState.x)) + "px";
          mount.style.top = Math.max(72, Math.min(maxTop, dragState.top + event.clientY - dragState.y)) + "px";
        });

        rail.addEventListener("pointerup", () => { dragState = null; });
        rail.addEventListener("pointercancel", () => { dragState = null; });

        resizeHandle.addEventListener("pointerdown", (event) => {
          if (shell.classList.contains("compact")) return;
          event.preventDefault();
          event.stopPropagation();
          resizeState = {
            x: event.clientX,
            y: event.clientY,
            width: shell.offsetWidth,
            height: shell.offsetHeight
          };
          resizeHandle.setPointerCapture(event.pointerId);
        });

        resizeHandle.addEventListener("pointermove", (event) => {
          if (!resizeState) return;
          const maxWidth = desktop.clientWidth - mount.offsetLeft - 12;
          const maxHeight = desktop.clientHeight - mount.offsetTop - 78;
          const width = Math.max(360, Math.min(maxWidth, resizeState.width + event.clientX - resizeState.x));
          const height = Math.max(96, Math.min(maxHeight, resizeState.height + event.clientY - resizeState.y));
          shell.style.width = width + "px";
          shell.style.height = height + "px";
          mount.style.width = width + "px";
          mount.style.height = height + "px";
        });

        resizeHandle.addEventListener("pointerup", () => { resizeState = null; });
        resizeHandle.addEventListener("pointercancel", () => { resizeState = null; });

        window.addEventListener("resize", () => snapHome(false));
        frame = window.requestAnimationFrame(renderVoice);
        window.addEventListener("beforeunload", () => window.cancelAnimationFrame(frame));
        window.requestAnimationFrame(() => runReplay());
      })();
    </script>
  </body>
</html>
