<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Undertone open turn</title>
  </head>
  <body>
    <section id="draft" class="draft" aria-label="Open turn">
      <header class="draftHeader">
        <span class="windowActions">
          <button id="snap" class="windowAction snap" type="button" aria-label="Move to default position" title="Move to default position">&#9678;</button>
          <button id="discard" class="windowAction discard" type="button" aria-label="Discard open turn" title="Discard open turn">&times;</button>
        </span>
      </header>
      <div id="draftViewport" class="draftViewport">
        <div id="draftText" class="draftText"></div>
      </div>
      <svg
        id="signalRim"
        class="signalRim"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <linearGradient id="auroraSignalGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="rgb(102 224 230)"></stop>
            <stop offset="0.52" stop-color="rgb(158 205 250)"></stop>
            <stop offset="1" stop-color="rgb(197 151 244)"></stop>
          </linearGradient>
        </defs>
        <rect id="signalPath" class="signalPath" pathLength="100"></rect>
      </svg>
    </section>
    <script type="module" src="/turn-draft/turnDraft.ts"></script>
  </body>
</html>
