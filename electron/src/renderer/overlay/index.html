<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Undertone status</title>
  </head>
  <body>
    <div id="shell" class="shell">
      <div id="draft" class="draft hidden" aria-hidden="true">
        <div class="draftHeader">
          <span id="draftMeta" class="draftMeta"></span>
        </div>
        <ol id="draftList" class="draftList"></ol>
      </div>
      <div id="pill" class="pill hidden" role="status" aria-live="polite">
        <div id="bars" class="bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <span id="check" class="check" aria-hidden="true">✓</span>
        <span id="label"></span>
      </div>
    </div>
    <script type="module" src="/overlay/overlay.ts"></script>
  </body>
</html>
