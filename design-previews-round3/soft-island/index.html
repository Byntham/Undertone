<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soft Island</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #151821; }

    #stage {
      position: relative;
      background:
        radial-gradient(circle at 50% 115%, rgba(95, 105, 132, .18), transparent 43%),
        linear-gradient(155deg, #20242d 0%, #151821 58%, #11141b 100%);
      transition: background .28s ease;
    }

    #stage::before,
    #stage::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity .28s ease;
    }

    #stage.light {
      background:
        radial-gradient(circle at 50% 110%, rgba(178, 171, 158, .2), transparent 46%),
        linear-gradient(155deg, #e8e6e1 0%, #d8d9d8 56%, #c9ccd0 100%);
    }

    #stage.busy {
      background:
        linear-gradient(117deg, transparent 0 12%, rgba(24, 29, 39, .86) 12.2% 36%, transparent 36.2%),
        linear-gradient(28deg, rgba(86, 64, 91, .42) 0 19%, transparent 19.2% 70%, rgba(44, 73, 89, .36) 70.2%),
        linear-gradient(155deg, #29303a 0%, #181c24 62%, #11141b 100%);
    }

    #stage.busy::before {
      inset: 8% 7% 28% 54%;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 15px;
      background:
        linear-gradient(rgba(255,255,255,.055), rgba(255,255,255,.055)) 24px 24px / 42% 8px no-repeat,
        linear-gradient(rgba(255,255,255,.035), rgba(255,255,255,.035)) 24px 48px / 75% 6px no-repeat,
        linear-gradient(rgba(255,255,255,.035), rgba(255,255,255,.035)) 24px 65px / 61% 6px no-repeat,
        rgba(10, 13, 19, .28);
      box-shadow: 0 22px 55px rgba(0,0,0,.18);
      opacity: 1;
    }

    #stage.busy::after {
      inset: 18% 61% 39% 5%;
      border-radius: 12px;
      background:
        radial-gradient(circle at 30px 28px, rgba(209, 123, 93, .38) 0 5px, transparent 5.5px),
        linear-gradient(rgba(255,255,255,.05), rgba(255,255,255,.05)) 54px 24px / 50% 7px no-repeat,
        linear-gradient(rgba(255,255,255,.028), rgba(255,255,255,.028)) 22px 55px / 78% 6px no-repeat,
        rgba(24, 28, 37, .7);
      border: 1px solid rgba(255,255,255,.055);
      opacity: 1;
    }

    .island {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 88px;
      width: 54px;
      height: 36px;
      overflow: hidden;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 999px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.98), transparent 32%),
        radial-gradient(circle at 82% 100%, rgba(205,194,174,.24), transparent 46%),
        linear-gradient(145deg, #f8f5ee 0%, #e9e4d9 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,.72) inset,
        0 -1px 0 rgba(147,129,103,.13) inset,
        0 10px 26px rgba(0,0,0,.22),
        0 2px 6px rgba(0,0,0,.14);
      color: #292722;
      transition:
        width 560ms cubic-bezier(.18,.86,.2,1),
        height 500ms cubic-bezier(.18,.86,.2,1),
        border-radius 520ms cubic-bezier(.18,.86,.2,1),
        box-shadow 220ms ease,
        transform 180ms ease,
        opacity 180ms ease;
      will-change: width, height, border-radius;
    }

    .island::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(63,53,40,.08) 0 .42px, transparent .55px),
        radial-gradient(circle, rgba(255,255,255,.36) 0 .5px, transparent .65px);
      background-position: 0 0, 4px 5px;
      background-size: 7px 7px, 9px 9px;
      opacity: .29;
      mix-blend-mode: multiply;
    }

    .island.transcribing {
      width: 72px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.72) inset,
        0 -1px 0 rgba(147,129,103,.13) inset,
        0 12px 30px rgba(0,0,0,.25),
        0 2px 6px rgba(0,0,0,.14);
    }

    .island.open {
      width: min(540px, calc(100% - 32px));
      height: 96px;
      border-radius: 25px;
    }

    .island.open:hover {
      box-shadow:
        0 1px 0 rgba(255,255,255,.8) inset,
        0 -1px 0 rgba(147,129,103,.13) inset,
        0 16px 40px rgba(0,0,0,.27),
        0 3px 8px rgba(0,0,0,.14);
    }

    .signal {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      display: flex;
      width: 30px;
      height: 22px;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transform: translate(-50%, -50%);
      transition:
        left 500ms cubic-bezier(.18,.86,.2,1),
        width 500ms cubic-bezier(.18,.86,.2,1),
        opacity 220ms ease;
    }

    .signal::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(174, 83, 58, .13);
      border-radius: 50%;
      opacity: 0;
      transform: scale(.68);
    }

    .bar {
      width: 3px;
      height: 6px;
      border-radius: 3px;
      background: #b65d43;
      box-shadow: 0 1px 1px rgba(116,56,40,.18);
      transform-origin: center;
    }

    .recording .bar:nth-child(1) { animation: voice 640ms ease-in-out -320ms infinite alternate; }
    .recording .bar:nth-child(2) { animation: voice 520ms ease-in-out -80ms infinite alternate; }
    .recording .bar:nth-child(3) { animation: voice 720ms ease-in-out -470ms infinite alternate; }
    .recording .bar:nth-child(4) { animation: voice 580ms ease-in-out -170ms infinite alternate; }
    .recording .bar:nth-child(5) { animation: voice 670ms ease-in-out -390ms infinite alternate; }

    .transcribing .signal::after { animation: process 900ms ease-out infinite; }
    .transcribing .bar { animation: think 820ms ease-in-out infinite; }
    .transcribing .bar:nth-child(2) { animation-delay: 90ms; }
    .transcribing .bar:nth-child(3) { animation-delay: 180ms; }
    .transcribing .bar:nth-child(4) { animation-delay: 270ms; }
    .transcribing .bar:nth-child(5) { animation-delay: 360ms; }

    .open .signal {
      left: 28px;
      width: 18px;
      gap: 1.5px;
    }

    .open .bar {
      width: 2px;
      height: 7px;
      background: #a9553e;
      opacity: .66;
      animation: none;
      transition: height 320ms ease, opacity 320ms ease;
    }

    .open .bar:nth-child(1),
    .open .bar:nth-child(5) { height: 3px; opacity: .38; }
    .open .bar:nth-child(2),
    .open .bar:nth-child(4) { height: 7px; opacity: .54; }
    .open .bar:nth-child(3) { height: 11px; opacity: .72; }

    .transcript {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 13px 72px 13px 52px;
      font-size: 14px;
      font-weight: 450;
      line-height: 1.45;
      letter-spacing: -.01em;
      color: #292722;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 220ms ease 270ms, transform 300ms ease 260ms;
    }

    .open .transcript {
      opacity: 1;
      transform: translateY(0);
    }

    .grip {
      position: absolute;
      z-index: 3;
      top: 7px;
      left: 50%;
      width: 27px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(77,69,57,.17) 25% 75%, transparent);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 220ms ease 280ms;
    }

    .open .grip { opacity: .7; }
    .open:hover .grip { opacity: 1; }

    .controls {
      position: absolute;
      z-index: 5;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-2px);
      transition: opacity 160ms ease, transform 180ms ease;
    }

    .open:hover .controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .control {
      display: grid;
      width: 29px;
      height: 29px;
      margin: 0;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(70,61,49,.11);
      border-radius: 50%;
      background: rgba(255,255,255,.54);
      color: #625b50;
      box-shadow: 0 1px 3px rgba(74,60,42,.08);
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .control:hover {
      background: rgba(255,255,255,.92);
      color: #2e2b26;
      transform: translateY(-1px);
    }

    .control.discard:hover { color: #a14334; }
    .control svg { width: 13px; height: 13px; }

    .island.discarding {
      opacity: 0;
      transform: translateX(-50%) scale(.94);
    }

    .island.snapping { animation: soft-snap 340ms cubic-bezier(.2,.8,.2,1); }

    @keyframes voice {
      from { height: 5px; }
      to { height: 19px; }
    }

    @keyframes think {
      0%, 100% { height: 5px; opacity: .48; }
      50% { height: 13px; opacity: 1; }
    }

    @keyframes process {
      0% { opacity: .48; transform: scale(.62); }
      85%, 100% { opacity: 0; transform: scale(1.12); }
    }

    @keyframes soft-snap {
      0%, 100% { transform: translateX(-50%) scale(1); }
      45% { transform: translateX(-50%) scale(.985); }
    }

    @media (max-width: 520px) {
      .transcript { padding-right: 52px; }
      .controls { top: 8px; right: 8px; }
      .control { width: 27px; height: 27px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="stage" class="dark">
    <section id="island" class="island" aria-live="polite">
      <div class="signal" aria-hidden="true">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <div id="transcript" class="transcript"></div>
      <div class="grip" aria-hidden="true"></div>
      <div id="controls" class="controls">
        <button id="snap" class="control" type="button" tabindex="-1" aria-label="Snap turn window">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="4.7" stroke="currentColor" stroke-width="1.25"/>
            <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="discard" class="control discard" type="button" tabindex="-1" aria-label="Discard open turn">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const island = document.getElementById('island');
      const transcriptNode = document.getElementById('transcript');
      const controls = document.getElementById('controls');
      const snap = document.getElementById('snap');
      const discard = document.getElementById('discard');
      const transcripts = {
        first: 'This is what the turn window looks like right now.',
        append: 'This is what the turn window looks like right now. The voice indicator and open turn now feel like one continuous surface.'
      };
      const validPhases = ['recording', 'transcribing', 'first', 'append'];
      const validScenes = ['dark', 'light', 'busy'];
      const params = new URLSearchParams(window.location.search);
      let phase = validPhases.includes(params.get('phase')) ? params.get('phase') : 'first';
      let scene = validScenes.includes(params.get('scene')) ? params.get('scene') : 'dark';
      let replayTimers = [];
      let restoreTimer = null;
      let replaying = false;

      function cancelReplay() {
        replayTimers.forEach(window.clearTimeout);
        replayTimers = [];
        replaying = false;
      }

      function renderPhase(nextPhase) {
        phase = nextPhase;
        island.classList.remove('recording', 'transcribing', 'open', 'discarding', 'snapping');
        island.classList.add(nextPhase);
        if (nextPhase === 'first' || nextPhase === 'append') island.classList.add('open');
        transcriptNode.textContent = transcripts[nextPhase] || '';
      }

      function setPhase(nextPhase) {
        if (!validPhases.includes(nextPhase)) return;
        cancelReplay();
        renderPhase(nextPhase);
      }

      function setScene(nextScene) {
        if (!validScenes.includes(nextScene)) return;
        scene = nextScene;
        stage.className = nextScene;
      }

      function replay() {
        cancelReplay();
        replaying = true;
        renderPhase('recording');
        replayTimers = [
          window.setTimeout(() => renderPhase('transcribing'), 1400),
          window.setTimeout(() => renderPhase('first'), 2250),
          window.setTimeout(() => {
            renderPhase('append');
            replayTimers = [];
            replaying = false;
          }, 3600)
        ];
      }

      function inspect() {
        const isOpen = phase === 'first' || phase === 'append';
        const intendedWidth = isOpen ? Math.min(540, window.innerWidth - 32) : (phase === 'transcribing' ? 72 : 54);
        return {
          concept: 'Soft Island',
          phase,
          scene,
          islandWidth: intendedWidth,
          islandHeight: isOpen ? 96 : 36,
          controlsOpacity: Number.parseFloat(getComputedStyle(controls).opacity),
          transcript: transcriptNode.textContent,
          replaying
        };
      }

      snap.addEventListener('click', () => {
        island.classList.remove('snapping');
        void island.offsetWidth;
        island.classList.add('snapping');
        window.setTimeout(() => island.classList.remove('snapping'), 360);
      });

      discard.addEventListener('click', () => {
        if (restoreTimer) window.clearTimeout(restoreTimer);
        island.classList.add('discarding');
        restoreTimer = window.setTimeout(() => island.classList.remove('discarding'), 620);
      });

      setScene(scene);
      renderPhase(phase);
      window.undertonePreview = { setPhase, setScene, replay, inspect };
    });
  </script>
</body>
</html>
