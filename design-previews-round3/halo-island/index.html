<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halo Island</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #0b0e13; }

    #stage {
      position: relative;
      background:
        radial-gradient(circle at 52% 18%, rgba(80, 91, 116, .13), transparent 40%),
        linear-gradient(145deg, #11151d 0%, #090c11 68%, #0d1016 100%);
      transition: background-color 240ms ease;
    }

    #stage.scene-light {
      background:
        radial-gradient(circle at 52% 18%, rgba(255, 255, 255, .88), transparent 40%),
        linear-gradient(145deg, #e9edf2 0%, #cfd5dd 68%, #dde2e8 100%);
    }

    #stage.scene-busy {
      background:
        linear-gradient(90deg, transparent 0 7%, rgba(13, 18, 27, .9) 7% 24%, transparent 24% 100%),
        linear-gradient(180deg, transparent 0 10%, rgba(204, 211, 221, .11) 10% 15%, transparent 15% 54%, rgba(10, 14, 22, .82) 54% 88%, transparent 88%),
        radial-gradient(circle at 70% 25%, rgba(90, 139, 164, .32), transparent 26%),
        radial-gradient(circle at 38% 62%, rgba(127, 93, 155, .22), transparent 34%),
        linear-gradient(145deg, #1e2733 0%, #10151d 100%);
    }

    .island {
      --halo-a: rgba(159, 213, 255, .78);
      --halo-b: rgba(186, 146, 255, .63);
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 88px;
      width: 54px;
      height: 36px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 18px;
      background:
        radial-gradient(circle at 28% 8%, rgba(255, 255, 255, .095), transparent 38%),
        linear-gradient(150deg, rgba(26, 30, 39, .97), rgba(10, 12, 17, .985));
      box-shadow:
        0 12px 32px rgba(0, 0, 0, .34),
        inset 0 1px 0 rgba(255, 255, 255, .055);
      color: rgba(247, 249, 253, .94);
      isolation: isolate;
      transition:
        width 520ms cubic-bezier(.2, .8, .2, 1),
        height 520ms cubic-bezier(.2, .8, .2, 1),
        border-radius 520ms cubic-bezier(.2, .8, .2, 1),
        border-color 260ms ease,
        box-shadow 260ms ease;
    }

    .island::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -3px;
      border-radius: inherit;
      background: conic-gradient(from 180deg, transparent 0 15%, var(--halo-b) 30%, var(--halo-a) 49%, transparent 66% 100%);
      filter: blur(5px);
      opacity: .9;
      transform: scale(1.02);
      transition: opacity 420ms ease, filter 420ms ease, transform 420ms ease;
    }

    .island::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(112deg, rgba(205, 233, 255, .78), rgba(179, 142, 255, .15) 39%, transparent 61%, rgba(148, 210, 255, .38));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .72;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    .island.phase-recording::before {
      animation: breathing-halo 680ms ease-in-out infinite alternate;
    }

    .island.phase-transcribing::before {
      animation: orbit-halo 900ms linear infinite;
      filter: blur(4px);
    }

    .island.settled {
      width: 540px;
      height: 96px;
      border-radius: 20px;
      border-color: rgba(255, 255, 255, .095);
      box-shadow:
        0 18px 50px rgba(0, 0, 0, .3),
        inset 0 1px 0 rgba(255, 255, 255, .045);
    }

    .island.settled::before {
      opacity: .22;
      filter: blur(7px);
      transform: scale(1.005);
      animation: none;
    }

    .island.settled::after {
      opacity: .35;
    }

    .signal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      opacity: 1;
      transform: scale(1);
      transition: opacity 180ms ease, transform 320ms ease;
    }

    .signal span {
      width: 2px;
      height: 6px;
      border-radius: 2px;
      background: rgba(224, 242, 255, .9);
      box-shadow: 0 0 6px rgba(149, 210, 255, .52);
      transform-origin: center;
    }

    .phase-recording .signal span:nth-child(1) { animation: level-one 510ms ease-in-out infinite alternate; }
    .phase-recording .signal span:nth-child(2) { animation: level-two 430ms ease-in-out -90ms infinite alternate; }
    .phase-recording .signal span:nth-child(3) { animation: level-three 570ms ease-in-out -180ms infinite alternate; }
    .phase-recording .signal span:nth-child(4) { animation: level-two 470ms ease-in-out -250ms infinite alternate-reverse; }
    .phase-recording .signal span:nth-child(5) { animation: level-one 540ms ease-in-out -120ms infinite alternate-reverse; }

    .phase-transcribing .signal { gap: 3px; }
    .phase-transcribing .signal span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      animation: processing 780ms ease-in-out infinite;
    }
    .phase-transcribing .signal span:nth-child(2) { animation-delay: 110ms; }
    .phase-transcribing .signal span:nth-child(3) { animation-delay: 220ms; }
    .phase-transcribing .signal span:nth-child(4) { animation-delay: 330ms; }
    .phase-transcribing .signal span:nth-child(5) { animation-delay: 440ms; }

    .settled .signal {
      opacity: 0;
      transform: scale(.7);
      pointer-events: none;
    }

    .transcript {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      padding: 24px 54px 18px 22px;
      overflow: hidden;
      font-size: 14px;
      font-weight: 430;
      line-height: 1.48;
      letter-spacing: -.006em;
      color: rgba(246, 248, 252, .94);
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 220ms ease 230ms, transform 300ms ease 220ms;
    }

    .settled .transcript {
      opacity: 1;
      transform: translateY(0);
    }

    .drag-affordance {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 24px;
      height: 2px;
      margin-left: -12px;
      border-radius: 2px;
      background: rgba(237, 243, 255, .15);
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    .settled .drag-affordance { opacity: .68; }

    .controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-2px);
      transition: opacity 150ms ease, transform 180ms ease;
    }

    .settled:hover .controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .control {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 9px;
      background: rgba(255, 255, 255, .055);
      color: rgba(236, 241, 249, .73);
      cursor: default;
      outline: none;
    }

    .control:hover { background: rgba(255, 255, 255, .1); color: #fff; }
    .control svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    .island.discarding {
      opacity: 0;
      transform: translateX(-50%) scale(.96);
      transition: opacity 160ms ease, transform 180ms ease;
    }

    .island.snapped::after { opacity: .72; }

    @keyframes breathing-halo {
      0% { opacity: .55; filter: blur(4px); transform: scale(1.01, 1.02); }
      45% { opacity: .98; filter: blur(7px); transform: scale(1.08, 1.12); }
      100% { opacity: .72; filter: blur(5px); transform: scale(1.04, 1.16); }
    }

    @keyframes orbit-halo { to { transform: rotate(360deg) scale(1.04); } }
    @keyframes level-one { from { transform: scaleY(.72); } to { transform: scaleY(1.45); } }
    @keyframes level-two { from { transform: scaleY(.8); } to { transform: scaleY(2.35); } }
    @keyframes level-three { from { transform: scaleY(1); } to { transform: scaleY(3.1); } }
    @keyframes processing { 0%, 80%, 100% { opacity: .28; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

    @media (max-width: 699px) {
      .island.settled { width: calc(100% - 32px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="stage" class="scene-dark">
    <section id="island" class="island phase-recording" aria-live="polite">
      <div class="signal" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="transcript" class="transcript"></div>
      <div class="drag-affordance" aria-hidden="true"></div>
      <div class="controls">
        <button id="snap" class="control" type="button" tabindex="-1" aria-label="Snap open turn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2"></circle><circle cx="8" cy="8" r="1.5"></circle><path d="M8 1v2M15 8h-2M8 15v-2M1 8h2"></path></svg>
        </button>
        <button id="discard" class="control" type="button" tabindex="-1" aria-label="Discard open turn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
        </button>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const transcripts = {
        first: "This is what the turn window looks like right now.",
        append: "This is what the turn window looks like right now. The voice indicator and open turn now feel like one continuous surface."
      };
      const validPhases = new Set(["recording", "transcribing", "first", "append"]);
      const validScenes = new Set(["dark", "light", "busy"]);
      const stage = document.getElementById("stage");
      const island = document.getElementById("island");
      const transcript = document.getElementById("transcript");
      const snap = document.getElementById("snap");
      const discard = document.getElementById("discard");
      let phase = "recording";
      let scene = "dark";
      let replayTimers = [];
      let replayRunning = false;

      function clearReplay() {
        replayTimers.forEach(clearTimeout);
        replayTimers = [];
        replayRunning = false;
      }

      function applyPhase(nextPhase) {
        if (!validPhases.has(nextPhase)) return;
        phase = nextPhase;
        island.classList.remove("phase-recording", "phase-transcribing", "phase-first", "phase-append", "settled", "discarding", "snapped");
        island.classList.add(`phase-${nextPhase}`);
        const settled = nextPhase === "first" || nextPhase === "append";
        if (settled) island.classList.add("settled");
        transcript.textContent = transcripts[nextPhase] || "";
      }

      function setPhase(nextPhase) {
        clearReplay();
        applyPhase(nextPhase);
      }

      function setScene(nextScene) {
        if (!validScenes.has(nextScene)) return;
        scene = nextScene;
        stage.classList.remove("scene-dark", "scene-light", "scene-busy");
        stage.classList.add(`scene-${nextScene}`);
      }

      function replay() {
        clearReplay();
        replayRunning = true;
        applyPhase("recording");
        replayTimers.push(setTimeout(() => applyPhase("transcribing"), 1400));
        replayTimers.push(setTimeout(() => applyPhase("first"), 2250));
        replayTimers.push(setTimeout(() => {
          applyPhase("append");
          replayTimers = [];
          replayRunning = false;
        }, 3600));
      }

      function inspect() {
        const rect = island.getBoundingClientRect();
        const controls = island.querySelector(".controls");
        return {
          concept: "Halo Island",
          phase,
          scene,
          islandWidth: Math.round(rect.width),
          islandHeight: Math.round(rect.height),
          controlsOpacity: Number.parseFloat(getComputedStyle(controls).opacity),
          transcript: transcript.textContent,
          replayRunning
        };
      }

      snap.addEventListener("pointerup", () => {
        if (!island.classList.contains("settled")) return;
        island.classList.add("snapped");
        setTimeout(() => island.classList.remove("snapped"), 420);
      });

      discard.addEventListener("pointerup", () => {
        if (!island.classList.contains("settled")) return;
        island.classList.add("discarding");
        setTimeout(() => island.classList.remove("discarding"), 520);
      });

      const params = new URLSearchParams(location.search);
      setScene(validScenes.has(params.get("scene")) ? params.get("scene") : "dark");
      applyPhase(validPhases.has(params.get("phase")) ? params.get("phase") : "recording");

      window.undertonePreview = { setPhase, setScene, replay, inspect };
    });
  </script>
</body>
</html>
