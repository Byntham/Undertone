<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undertone preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #11151c; }

    #stage {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 115%, rgba(91, 113, 145, .12), transparent 43%),
        linear-gradient(145deg, #171c24 0%, #0e1218 100%);
      transition: background-color 240ms ease;
    }

    #stage::before,
    #stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 240ms ease;
    }

    #stage[data-scene="light"] {
      background:
        radial-gradient(ellipse at 50% 115%, rgba(87, 111, 148, .10), transparent 45%),
        linear-gradient(145deg, #f0f2f5 0%, #d9dee5 100%);
    }

    #stage[data-scene="busy"] {
      background:
        linear-gradient(rgba(12, 16, 22, .38), rgba(12, 16, 22, .38)),
        radial-gradient(circle at 13% 18%, #534b65 0 8%, transparent 23%),
        radial-gradient(circle at 80% 26%, #215062 0 10%, transparent 27%),
        linear-gradient(135deg, #2a3039, #151922 66%);
    }

    #stage[data-scene="busy"]::before {
      inset: 9% 8% 29%;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px;
      opacity: .72;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08) 0 22%, transparent 22%),
        repeating-linear-gradient(0deg, transparent 0 28px, rgba(255,255,255,.045) 29px 30px);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    #stage[data-scene="busy"]::after {
      width: 16%;
      height: 7px;
      left: 32%;
      top: 18%;
      border-radius: 10px;
      opacity: .35;
      background: rgba(255,255,255,.46);
      box-shadow:
        0 27px 0 rgba(255,255,255,.18),
        0 54px 0 rgba(255,255,255,.22),
        245px 18px 0 rgba(255,255,255,.26),
        245px 45px 0 rgba(255,255,255,.14);
    }

    .island {
      position: absolute;
      left: 50%;
      bottom: 88px;
      width: 54px;
      height: 36px;
      max-width: calc(100% - 32px);
      transform: translateX(-50%);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      color: #f4f7fb;
      background:
        linear-gradient(180deg, rgba(38,43,52,.98), rgba(16,19,25,.98));
      box-shadow:
        0 12px 34px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.08);
      transition:
        width 520ms cubic-bezier(.22,.8,.2,1),
        height 520ms cubic-bezier(.22,.8,.2,1),
        border-radius 520ms cubic-bezier(.22,.8,.2,1),
        box-shadow 180ms ease,
        opacity 160ms ease,
        transform 180ms ease;
      will-change: width, height, border-radius;
    }

    .island.settled {
      width: 540px;
      height: 96px;
      border-radius: 19px;
      background:
        linear-gradient(180deg, rgba(36,41,49,.98), rgba(18,21,27,.985));
    }

    #stage[data-scene="light"] .island {
      border-color: rgba(18,27,39,.12);
      color: #17202b;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(237,240,244,.98));
      box-shadow: 0 14px 34px rgba(47,57,70,.18), inset 0 1px 0 rgba(255,255,255,.9);
    }

    .signal {
      position: absolute;
      left: 0;
      top: 0;
      width: 54px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      opacity: 1;
      transform-origin: center;
      transition: opacity 180ms ease, transform 420ms cubic-bezier(.22,.8,.2,1);
    }

    .bar {
      width: 2px;
      height: 5px;
      border-radius: 3px;
      background: #d4e8ff;
      box-shadow: 0 0 7px rgba(139,194,255,.22);
      transform: scaleY(var(--level, 1));
    }

    #stage[data-scene="light"] .bar {
      background: #52677d;
      box-shadow: none;
    }

    .recording .bar {
      animation: voice 560ms ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .transcribing .bar {
      animation: process 760ms ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .rail {
      position: absolute;
      left: 50%;
      top: 10px;
      width: 34px;
      height: 4px;
      border-radius: 5px;
      opacity: 0;
      transform: translate(-50%, -4px) scaleX(.35);
      background: rgba(204,217,233,.34);
      transition: opacity 240ms 220ms ease, transform 420ms 110ms cubic-bezier(.22,.8,.2,1), background 160ms ease;
    }

    #stage[data-scene="light"] .rail { background: rgba(41,55,71,.25); }

    .settled .signal {
      opacity: 0;
      transform: translateX(243px) scaleX(.62);
      pointer-events: none;
    }

    .settled .rail {
      opacity: 1;
      transform: translate(-50%, 0) scaleX(1);
    }

    .settled:hover .rail { background: rgba(215,227,241,.53); }
    #stage[data-scene="light"] .settled:hover .rail { background: rgba(41,55,71,.43); }

    .transcript {
      position: absolute;
      inset: 27px 69px 16px 20px;
      margin: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -.01em;
      color: inherit;
      opacity: 0;
      transform: translateY(7px);
      transition: opacity 260ms 250ms ease, transform 360ms 210ms cubic-bezier(.22,.8,.2,1);
      user-select: none;
    }

    .settled .transcript {
      opacity: 1;
      transform: translateY(0);
    }

    .actions {
      position: absolute;
      right: 12px;
      top: 50%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      pointer-events: none;
      transform: translate(5px, -50%);
      transition: opacity 150ms ease, transform 180ms ease;
    }

    .settled:hover .actions {
      opacity: 1;
      pointer-events: auto;
      transform: translate(0, -50%);
    }

    .action {
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: rgba(231,238,247,.72);
      background: rgba(255,255,255,.055);
      cursor: default;
    }

    .action:hover { color: #fff; background: rgba(255,255,255,.11); }
    .action.discard:hover { color: #ffb3ae; background: rgba(234,84,74,.13); }
    #stage[data-scene="light"] .action { color: rgba(25,37,51,.65); background: rgba(24,37,52,.055); }
    #stage[data-scene="light"] .action:hover { color: #101820; background: rgba(24,37,52,.1); }
    #stage[data-scene="light"] .action.discard:hover { color: #b23731; background: rgba(195,55,46,.1); }

    .action svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .island.discarding {
      opacity: 0;
      transform: translateX(-50%) scale(.94);
    }

    @keyframes voice {
      0% { transform: scaleY(.65); }
      100% { transform: scaleY(var(--level)); }
    }

    @keyframes process {
      0%, 100% { transform: scaleY(.55); opacity: .35; }
      50% { transform: scaleY(1.4); opacity: 1; }
    }

    @media (max-width: 699px) {
      .island.settled { width: calc(100% - 32px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .island,
      .signal,
      .rail,
      .transcript,
      .actions { transition-duration: .01ms !important; transition-delay: 0ms !important; }
      .bar { animation: none !important; }
      .recording .bar { transform: scaleY(var(--level)); }
    }
  </style>
</head>
<body>
  <main id="stage" data-scene="dark">
    <section id="island" class="island" aria-label="Dictation turn">
      <div class="signal" aria-hidden="true">
        <i class="bar" style="--level:.8;--delay:-80ms"></i>
        <i class="bar" style="--level:1.7;--delay:-430ms"></i>
        <i class="bar" style="--level:2.8;--delay:-210ms"></i>
        <i class="bar" style="--level:1.5;--delay:-520ms"></i>
        <i class="bar" style="--level:2.2;--delay:-310ms"></i>
        <i class="bar" style="--level:1.1;--delay:-610ms"></i>
        <i class="bar" style="--level:.7;--delay:-150ms"></i>
      </div>
      <div class="rail" aria-hidden="true"></div>
      <p id="transcript" class="transcript"></p>
      <div id="actions" class="actions">
        <button class="action" type="button" tabindex="-1" aria-label="Snap turn window">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg>
        </button>
        <button id="discard" class="action discard" type="button" tabindex="-1" aria-label="Discard turn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 4.5h9M6 4.5V3h4v1.5M5 6.5l.5 6h5l.5-6M7 7.5v3M9 7.5v3"/></svg>
        </button>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const island = document.getElementById('island');
      const transcriptNode = document.getElementById('transcript');
      const actions = document.getElementById('actions');
      const discard = document.getElementById('discard');
      const copy = {
        first: 'This is what the turn window looks like right now.',
        append: 'This is what the turn window looks like right now. The voice indicator and open turn now feel like one continuous surface.'
      };
      const phases = new Set(['recording', 'transcribing', 'first', 'append']);
      const scenes = new Set(['dark', 'light', 'busy']);
      const replayTimers = [];
      let phase = 'first';
      let scene = 'dark';
      let replaying = false;

      function cancelReplay() {
        replayTimers.splice(0).forEach(clearTimeout);
        replaying = false;
      }

      function applyPhase(next) {
        if (!phases.has(next)) return;
        phase = next;
        island.classList.remove('recording', 'transcribing', 'settled', 'discarding');
        island.classList.add(next);
        if (next === 'first' || next === 'append') island.classList.add('settled');
        transcriptNode.textContent = copy[next] || '';
      }

      function setPhase(next) {
        cancelReplay();
        applyPhase(next);
      }

      function setScene(next) {
        if (!scenes.has(next)) return;
        scene = next;
        stage.dataset.scene = next;
      }

      function replay() {
        cancelReplay();
        replaying = true;
        applyPhase('recording');
        replayTimers.push(setTimeout(() => applyPhase('transcribing'), 1400));
        replayTimers.push(setTimeout(() => applyPhase('first'), 2250));
        replayTimers.push(setTimeout(() => {
          applyPhase('append');
          replaying = false;
          replayTimers.length = 0;
        }, 3600));
      }

      function inspect() {
        const islandStyle = getComputedStyle(island);
        const actionStyle = getComputedStyle(actions);
        return {
          concept: 'Rail Island',
          phase,
          scene,
          islandWidth: Math.round(parseFloat(islandStyle.width)),
          islandHeight: Math.round(parseFloat(islandStyle.height)),
          controlsOpacity: Number(actionStyle.opacity),
          transcript: transcriptNode.textContent,
          replaying
        };
      }

      discard.addEventListener('click', () => {
        if (!island.classList.contains('settled')) return;
        island.classList.add('discarding');
        setTimeout(() => island.classList.remove('discarding'), 430);
      });

      const params = new URLSearchParams(location.search);
      const initialPhase = phases.has(params.get('phase')) ? params.get('phase') : 'first';
      const initialScene = scenes.has(params.get('scene')) ? params.get('scene') : 'dark';
      setScene(initialScene);
      applyPhase(initialPhase);

      window.undertonePreview = { setPhase, setScene, replay, inspect };
    });
  </script>
</body>
</html>
