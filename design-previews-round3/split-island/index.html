<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undertone Split Island Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #080b12; }

    #stage {
      --desk-a: #0d1320;
      --desk-b: #080b11;
      --desk-glow: rgba(58, 93, 142, 0.14);
      --island-a: rgba(17, 22, 31, 0.96);
      --island-b: rgba(7, 10, 16, 0.98);
      --island-border: rgba(255, 255, 255, 0.13);
      --island-highlight: rgba(255, 255, 255, 0.12);
      --text: rgba(249, 251, 255, 0.94);
      --muted: rgba(220, 228, 241, 0.44);
      --signal: #8be4ff;
      --signal-2: #8f9dff;
      position: relative;
      background:
        radial-gradient(70% 65% at 50% 94%, var(--desk-glow), transparent 68%),
        linear-gradient(155deg, var(--desk-a), var(--desk-b));
      transition: background 280ms ease;
      isolation: isolate;
    }

    #stage::before,
    #stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      transition: opacity 280ms ease, background 280ms ease;
    }

    #stage::before {
      inset: 9% 8% 25%;
      border: 1px solid rgba(255,255,255,0.035);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
      box-shadow: 0 32px 80px rgba(0,0,0,0.16);
      opacity: 0.42;
    }

    #stage::after {
      inset: 0;
      opacity: 0;
      background:
        linear-gradient(90deg, transparent 0 7%, rgba(255,255,255,.035) 7% 28%, transparent 28% 30%, rgba(255,255,255,.026) 30% 70%, transparent 70% 72%, rgba(255,255,255,.035) 72% 93%, transparent 93%),
        linear-gradient(transparent 0 13%, rgba(255,255,255,.022) 13% 46%, transparent 46% 49%, rgba(255,255,255,.025) 49% 82%, transparent 82%);
      filter: blur(0.2px);
    }

    #stage.light {
      color-scheme: light;
      --desk-a: #edf1f5;
      --desk-b: #cfd7df;
      --desk-glow: rgba(255, 255, 255, 0.62);
      --island-a: rgba(29, 33, 40, 0.96);
      --island-b: rgba(10, 13, 18, 0.98);
      --island-border: rgba(255,255,255,0.23);
      --island-highlight: rgba(255,255,255,0.17);
    }

    #stage.light::before {
      border-color: rgba(54,66,79,.09);
      background: linear-gradient(145deg, rgba(255,255,255,.5), rgba(120,136,150,.06));
      box-shadow: 0 32px 80px rgba(51,61,72,.12);
    }

    #stage.busy {
      --desk-a: #101a2a;
      --desk-b: #18111c;
      --desk-glow: rgba(104, 87, 184, 0.18);
    }

    #stage.busy::before {
      inset: 7% 5% 22%;
      opacity: .74;
      background:
        linear-gradient(90deg, rgba(255,255,255,.035), transparent 24%),
        radial-gradient(circle at 85% 18%, rgba(88,146,255,.1), transparent 24%),
        linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.006));
    }

    #stage.busy::after { opacity: 1; }

    .island {
      position: absolute;
      left: 50%;
      bottom: 88px;
      width: 54px;
      height: 36px;
      transform: translateX(-50%);
      border: 1px solid var(--island-border);
      border-radius: 19px;
      color: var(--text);
      background:
        linear-gradient(180deg, var(--island-highlight), transparent 46%),
        linear-gradient(145deg, var(--island-a), var(--island-b));
      box-shadow:
        0 17px 44px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      overflow: hidden;
      transition:
        width 520ms cubic-bezier(.22,.9,.2,1),
        height 520ms cubic-bezier(.22,.9,.2,1),
        border-radius 520ms cubic-bezier(.22,.9,.2,1),
        box-shadow 280ms ease,
        opacity 180ms ease,
        transform 280ms ease;
      will-change: width, height, border-radius;
    }

    .island::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(160px 80px at 22% 0%, rgba(139,228,255,.085), transparent 68%),
        radial-gradient(140px 70px at 84% 110%, rgba(143,157,255,.07), transparent 70%);
      opacity: 0;
      transition: opacity 420ms ease 120ms;
    }

    .island.is-open {
      width: min(540px, calc(100% - 32px));
      height: 96px;
      border-radius: 24px;
    }

    .island.is-open::before { opacity: 1; }

    .island.is-transcribing {
      width: 106px;
      border-radius: 19px;
    }

    .island.discarding {
      opacity: .18;
      transform: translateX(-50%) scale(.96);
    }

    .island.snapped {
      box-shadow:
        0 17px 44px rgba(0,0,0,.38),
        0 0 0 2px rgba(139,228,255,.16),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .signal-lobe,
    .process-lobe {
      position: absolute;
      display: grid;
      place-items: center;
      pointer-events: none;
      transition:
        left 500ms cubic-bezier(.22,.9,.2,1),
        right 500ms cubic-bezier(.22,.9,.2,1),
        top 500ms cubic-bezier(.22,.9,.2,1),
        bottom 500ms cubic-bezier(.22,.9,.2,1),
        width 500ms cubic-bezier(.22,.9,.2,1),
        height 500ms cubic-bezier(.22,.9,.2,1),
        border-radius 500ms cubic-bezier(.22,.9,.2,1),
        opacity 220ms ease,
        background 320ms ease;
    }

    .signal-lobe {
      inset: 0;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 50%, rgba(139,228,255,.1), transparent 70%);
    }

    .process-lobe {
      top: 5px;
      right: 5px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      opacity: 0;
      background: rgba(143,157,255,.08);
    }

    .is-transcribing .signal-lobe {
      inset: 4px auto 4px 4px;
      width: 52px;
      height: 26px;
      border-radius: 14px;
      background: rgba(139,228,255,.07);
    }

    .is-transcribing .process-lobe { opacity: 1; }

    .is-open .signal-lobe {
      inset: auto auto 6px 50%;
      width: 68px;
      height: 15px;
      transform: translateX(-50%);
      border-radius: 9px 9px 14px 14px;
      background:
        linear-gradient(180deg, rgba(139,228,255,.055), rgba(143,157,255,.025));
      box-shadow: inset 0 1px 0 rgba(139,228,255,.11);
    }

    .is-open .process-lobe {
      top: auto;
      right: calc(50% - 42px);
      bottom: 11px;
      width: 4px;
      height: 4px;
      opacity: .32;
      background: var(--signal-2);
      box-shadow: -84px 0 0 rgba(139,228,255,.52);
    }

    .bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 34px;
      height: 22px;
    }

    .bar {
      width: 2px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--signal), var(--signal-2));
      box-shadow: 0 0 7px rgba(139,228,255,.24);
      transform-origin: center;
    }

    .is-recording .bar {
      animation: voice 560ms ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .is-recording .bar:nth-child(2n) { animation-duration: 420ms; }
    .is-recording .bar:nth-child(3n) { animation-duration: 680ms; }

    .is-transcribing .bar {
      animation: breathe 860ms ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .is-open .bars {
      width: 38px;
      height: 12px;
      gap: 3px;
    }

    .is-open .bar {
      width: 2px;
      height: 2px;
      opacity: .42;
      animation: none;
      box-shadow: none;
    }

    .is-open .bar:nth-child(2),
    .is-open .bar:nth-child(6) { height: 4px; }

    .is-open .bar:nth-child(3),
    .is-open .bar:nth-child(5) { height: 6px; }

    .process-ring {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(143,157,255,.24);
      border-top-color: var(--signal);
      animation: spin 780ms linear infinite;
    }

    .is-open .process-ring { display: none; }

    .transcript {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: flex;
      align-items: flex-start;
      margin: 0;
      padding: 20px 62px 24px 22px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.48;
      font-weight: 430;
      letter-spacing: -.006em;
      opacity: 0;
      transform: translateY(7px);
      transition: opacity 230ms ease 190ms, transform 360ms cubic-bezier(.2,.8,.2,1) 150ms;
      user-select: none;
      pointer-events: none;
    }

    .is-open .transcript {
      opacity: 1;
      transform: translateY(0);
    }

    .drag-affordance {
      position: absolute;
      z-index: 3;
      top: 7px;
      left: 50%;
      width: 22px;
      height: 2px;
      margin-left: -11px;
      border-radius: 999px;
      background: var(--muted);
      opacity: 0;
      transition: opacity 220ms ease 250ms;
      pointer-events: none;
    }

    .is-open .drag-affordance { opacity: .48; }

    .controls {
      position: absolute;
      z-index: 4;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-2px);
      transition: opacity 150ms ease, transform 180ms ease;
    }

    .island.is-open:hover .controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .control {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 9px;
      color: rgba(242,247,255,.7);
      background: rgba(255,255,255,.055);
      cursor: pointer;
      outline: none;
      -webkit-app-region: no-drag;
      transition: color 130ms ease, background 130ms ease, border-color 130ms ease;
    }

    .control:hover {
      color: #fff;
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.11);
    }

    .control.discard:hover {
      color: #ffb7bd;
      border-color: rgba(255,112,125,.25);
      background: rgba(255,83,100,.11);
    }

    .control svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes voice {
      0% { transform: scaleY(.72); opacity: .62; }
      100% { transform: scaleY(2.7); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { transform: scaleY(.65); opacity: .42; }
      50% { transform: scaleY(1.4); opacity: .92; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
        transition-delay: 0ms !important;
      }

      .is-recording .bar:nth-child(2),
      .is-recording .bar:nth-child(6) { height: 10px; }
      .is-recording .bar:nth-child(4) { height: 15px; }
    }
  </style>
</head>
<body>
  <main id="stage" class="dark" aria-label="Desktop preview">
    <section id="island" class="island is-recording" aria-label="Undertone voice and transcript surface">
      <div class="signal-lobe" aria-hidden="true">
        <div class="bars">
          <i class="bar" style="--delay:-40ms"></i>
          <i class="bar" style="--delay:-280ms"></i>
          <i class="bar" style="--delay:-130ms"></i>
          <i class="bar" style="--delay:-360ms"></i>
          <i class="bar" style="--delay:-190ms"></i>
          <i class="bar" style="--delay:-80ms"></i>
          <i class="bar" style="--delay:-310ms"></i>
        </div>
      </div>
      <div class="process-lobe" aria-hidden="true"><span class="process-ring"></span></div>
      <p id="transcript" class="transcript"></p>
      <span class="drag-affordance" aria-hidden="true"></span>
      <div id="controls" class="controls">
        <button id="snap" class="control" type="button" tabindex="-1" aria-label="Snap open turn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.25 2.25h5.5v4l1.5 1.5v1H3.75v-1l1.5-1.5zM8 8.75v5"/></svg>
        </button>
        <button id="discard" class="control discard" type="button" tabindex="-1" aria-label="Discard open turn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.25 4.25 7.5 7.5m0-7.5-7.5 7.5"/></svg>
        </button>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const FIRST = 'This is what the turn window looks like right now.';
      const APPEND = 'This is what the turn window looks like right now. The voice indicator and open turn now feel like one continuous surface.';
      const PHASES = new Set(['recording', 'transcribing', 'first', 'append']);
      const SCENES = new Set(['dark', 'light', 'busy']);
      const stage = document.getElementById('stage');
      const island = document.getElementById('island');
      const transcript = document.getElementById('transcript');
      const controls = document.getElementById('controls');
      const snap = document.getElementById('snap');
      const discard = document.getElementById('discard');
      let phase = 'recording';
      let scene = 'dark';
      let replayTimers = [];
      let replaying = false;
      let localTimer = null;

      function clearReplay() {
        replayTimers.forEach(clearTimeout);
        replayTimers = [];
        replaying = false;
      }

      function applyPhase(next) {
        if (!PHASES.has(next)) return;
        phase = next;
        island.classList.remove('is-recording', 'is-transcribing', 'is-open', 'is-first', 'is-append');
        island.classList.add(`is-${next}`);
        if (next === 'first' || next === 'append') island.classList.add('is-open');
        transcript.textContent = next === 'first' ? FIRST : next === 'append' ? APPEND : '';
      }

      function setPhase(next) {
        clearReplay();
        applyPhase(next);
      }

      function setScene(next) {
        if (!SCENES.has(next)) return;
        scene = next;
        stage.classList.remove('dark', 'light', 'busy');
        stage.classList.add(next);
      }

      function replay() {
        clearReplay();
        replaying = true;
        applyPhase('recording');
        replayTimers = [
          setTimeout(() => applyPhase('transcribing'), 1400),
          setTimeout(() => applyPhase('first'), 2250),
          setTimeout(() => {
            applyPhase('append');
            replayTimers = [];
            replaying = false;
          }, 3600)
        ];
      }

      function inspect() {
        const rect = island.getBoundingClientRect();
        return {
          concept: 'Split Island',
          phase,
          scene,
          islandWidth: Math.round(rect.width),
          islandHeight: Math.round(rect.height),
          controlsOpacity: Number.parseFloat(getComputedStyle(controls).opacity),
          transcript: transcript.textContent,
          replaying
        };
      }

      snap.addEventListener('click', () => {
        island.classList.add('snapped');
        window.setTimeout(() => island.classList.remove('snapped'), 420);
      });

      discard.addEventListener('click', () => {
        window.clearTimeout(localTimer);
        island.classList.add('discarding');
        localTimer = window.setTimeout(() => island.classList.remove('discarding'), 520);
      });

      window.undertonePreview = { setPhase, setScene, replay, inspect };

      const params = new URLSearchParams(window.location.search);
      const requestedPhase = params.get('phase');
      const requestedScene = params.get('scene');
      setScene(SCENES.has(requestedScene) ? requestedScene : 'dark');
      setPhase(PHASES.has(requestedPhase) ? requestedPhase : 'recording');
    });
  </script>
</body>
</html>
