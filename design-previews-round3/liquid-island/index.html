<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Island</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #stage {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #0b0e13; }

    #stage {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 18%, rgba(85, 102, 130, .16), transparent 35%),
        linear-gradient(145deg, #151a22 0%, #0b0e13 58%, #11151c 100%);
      transition: background-color 280ms ease;
    }

    #stage::before,
    #stage::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    #stage::before {
      inset: 0;
      opacity: .42;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    #stage::after {
      width: min(62vw, 620px);
      height: min(43vh, 350px);
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 18px;
      background: rgba(255,255,255,.018);
      box-shadow: 0 26px 80px rgba(0,0,0,.18);
    }

    #stage.scene-light {
      color-scheme: light;
      background:
        radial-gradient(circle at 22% 15%, rgba(104, 151, 210, .24), transparent 37%),
        linear-gradient(145deg, #f3f5f8 0%, #dce2e9 60%, #e9edf1 100%);
    }

    #stage.scene-light::before {
      opacity: .55;
      background:
        linear-gradient(rgba(21,31,44,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21,31,44,.03) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    #stage.scene-light::after {
      border-color: rgba(20,30,44,.09);
      background: rgba(255,255,255,.34);
      box-shadow: 0 26px 80px rgba(52,65,82,.12);
    }

    #stage.scene-busy {
      background:
        radial-gradient(circle at 14% 24%, rgba(72, 146, 183, .4), transparent 20%),
        radial-gradient(circle at 79% 13%, rgba(152, 91, 152, .28), transparent 23%),
        linear-gradient(118deg, #111722 0 28%, #283241 28% 53%, #141923 53% 100%);
    }

    #stage.scene-busy::before {
      inset: 8% 6% 21%;
      opacity: 1;
      border-radius: 18px;
      background:
        linear-gradient(90deg, rgba(7,10,16,.74) 0 18%, transparent 18%),
        repeating-linear-gradient(0deg, transparent 0 25px, rgba(255,255,255,.055) 26px 27px),
        linear-gradient(120deg, rgba(255,255,255,.12), rgba(255,255,255,.025));
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 30px 90px rgba(0,0,0,.38);
    }

    #stage.scene-busy::after {
      top: 16%;
      left: 29%;
      width: 12%;
      height: 48%;
      transform: none;
      border: 0;
      border-radius: 8px;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.14) 0 7px, transparent 7px 24px);
      box-shadow: 27vw 3vh 0 rgba(255,255,255,.035);
    }

    .island {
      --island-w: 54px;
      --island-h: 36px;
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 88px;
      width: var(--island-w);
      height: var(--island-h);
      transform: translateX(-50%);
      border-radius: 22px;
      overflow: hidden;
      color: rgba(250, 252, 255, .96);
      background:
        radial-gradient(120% 190% at 12% -28%, rgba(255,255,255,.24), transparent 39%),
        radial-gradient(95% 130% at 100% 120%, rgba(110,181,255,.12), transparent 52%),
        linear-gradient(118deg, rgba(22,28,38,.83), rgba(7,10,15,.91) 60%, rgba(19,26,34,.86));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        0 18px 48px rgba(0,0,0,.42),
        0 2px 8px rgba(0,0,0,.36),
        inset 0 1px 0 rgba(255,255,255,.24),
        inset 0 -1px 0 rgba(0,0,0,.55);
      backdrop-filter: blur(23px) saturate(148%) contrast(106%);
      -webkit-backdrop-filter: blur(23px) saturate(148%) contrast(106%);
      transition:
        width 560ms cubic-bezier(.2,.88,.2,1),
        height 560ms cubic-bezier(.2,.88,.2,1),
        border-radius 560ms cubic-bezier(.2,.88,.2,1),
        box-shadow 280ms ease,
        transform 220ms ease,
        opacity 220ms ease;
    }

    .island::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(55px 21px at 9% 12%, rgba(255,255,255,.17), transparent 69%),
        radial-gradient(120px 26px at 86% 101%, rgba(64,155,255,.11), transparent 76%),
        linear-gradient(100deg, transparent 18%, rgba(255,255,255,.055) 43%, transparent 67%);
      mix-blend-mode: screen;
      opacity: .9;
      transition: opacity 300ms ease;
    }

    .island::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(104deg, rgba(255,255,255,.34), transparent 13% 83%, rgba(133,204,255,.18)) border-box;
      padding: 1px;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .78;
    }

    .phase-first .island,
    .phase-append .island {
      --island-w: 540px;
      --island-h: 96px;
      border-radius: 25px;
    }

    .phase-transcribing .island {
      border-color: rgba(187,224,255,.28);
      box-shadow:
        0 19px 52px rgba(0,0,0,.44),
        0 0 0 1px rgba(120,191,255,.08),
        inset 0 1px 0 rgba(255,255,255,.29),
        inset 0 -1px 0 rgba(0,0,0,.5);
    }

    .phase-first .island:hover,
    .phase-append .island:hover {
      box-shadow:
        0 22px 58px rgba(0,0,0,.48),
        0 0 0 1px rgba(155,210,255,.1),
        inset 0 1px 0 rgba(255,255,255,.3),
        inset 0 -1px 0 rgba(0,0,0,.55);
    }

    .liquid-caustic {
      position: absolute;
      z-index: 1;
      left: -20px;
      top: -22px;
      width: 118px;
      height: 78px;
      border: 16px solid rgba(189,226,255,.07);
      border-radius: 50%;
      filter: blur(6px);
      pointer-events: none;
      opacity: .75;
      transform: rotate(-18deg);
      transition: width 500ms ease, opacity 300ms ease;
    }

    .phase-first .liquid-caustic,
    .phase-append .liquid-caustic {
      width: 260px;
      opacity: .43;
    }

    .signal {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      display: flex;
      width: 34px;
      height: 20px;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transform: translate(-50%, -50%);
      transition: left 500ms cubic-bezier(.2,.88,.2,1), opacity 220ms ease, transform 500ms cubic-bezier(.2,.88,.2,1);
    }

    .signal span {
      width: 2px;
      height: var(--h);
      min-height: 3px;
      border-radius: 3px;
      background: linear-gradient(to bottom, #d9f4ff, #72bcff 72%, #a692ff);
      box-shadow: 0 0 7px rgba(115,193,255,.58);
      transform-origin: center;
    }

    .phase-recording .signal span {
      animation: voice 620ms ease-in-out infinite alternate;
      animation-delay: var(--d);
    }

    .phase-transcribing .signal {
      animation: processing 800ms ease-in-out infinite;
    }

    .phase-transcribing .signal span {
      height: 3px;
      opacity: .72;
      transition: height 240ms ease;
    }

    .phase-first .signal,
    .phase-append .signal {
      left: 28px;
      opacity: .58;
      transform: translate(-50%, -50%) scaleX(.55);
    }

    .phase-first .signal span,
    .phase-append .signal span {
      height: 2px;
      background: rgba(150,207,255,.72);
      box-shadow: none;
      transition: height 300ms ease, background 300ms ease;
    }

    .content {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 17px 82px 17px 52px;
      opacity: 0;
      transform: translateY(7px);
      transition: opacity 190ms ease 240ms, transform 340ms ease 180ms;
      pointer-events: none;
    }

    .phase-first .content,
    .phase-append .content {
      opacity: 1;
      transform: translateY(0);
    }

    .transcript {
      display: -webkit-box;
      max-width: 100%;
      overflow: hidden;
      color: rgba(251,253,255,.96);
      font-size: 14px;
      font-weight: 450;
      line-height: 1.45;
      letter-spacing: -.005em;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .drag-affordance {
      position: absolute;
      z-index: 4;
      top: 7px;
      left: 50%;
      width: 20px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,.16);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .phase-first .drag-affordance,
    .phase-append .drag-affordance { opacity: .82; }

    .controls {
      position: absolute;
      z-index: 6;
      top: 50%;
      right: 12px;
      display: flex;
      gap: 5px;
      opacity: 0;
      transform: translateY(-50%) translateX(5px);
      transition: opacity 150ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .phase-first .island:hover .controls,
    .phase-append .island:hover .controls {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      pointer-events: auto;
    }

    .control {
      display: grid;
      width: 28px;
      height: 28px;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
      color: rgba(241,247,253,.82);
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
      cursor: pointer;
    }

    .control:hover {
      color: #fff;
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
    }

    .control:active { transform: scale(.92); }
    .control svg { width: 13px; height: 13px; }

    .island.discarding {
      opacity: .2;
      transform: translateX(-50%) scale(.94);
    }

    .island.snapping { animation: snap-pulse 360ms ease; }

    @keyframes voice {
      0% { transform: scaleY(.35); opacity: .66; }
      100% { transform: scaleY(1.08); opacity: 1; }
    }

    @keyframes processing {
      0%, 100% { transform: translate(-50%, -50%) scaleX(.62); filter: brightness(.9); }
      50% { transform: translate(-50%, -50%) scaleX(1); filter: brightness(1.3); }
    }

    @keyframes snap-pulse {
      50% { transform: translateX(-50%) scale(.985); }
    }

    @media (max-width: 699px) {
      .phase-first .island,
      .phase-append .island {
        --island-w: calc(100vw - 32px);
      }
      .content { padding-right: 78px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="stage" class="scene-dark phase-recording">
    <section class="island" aria-live="polite">
      <div class="liquid-caustic" aria-hidden="true"></div>
      <div class="signal" aria-hidden="true">
        <span style="--h:8px;--d:-120ms"></span>
        <span style="--h:14px;--d:-430ms"></span>
        <span style="--h:19px;--d:-260ms"></span>
        <span style="--h:11px;--d:-520ms"></span>
        <span style="--h:16px;--d:-70ms"></span>
        <span style="--h:7px;--d:-340ms"></span>
        <span style="--h:12px;--d:-180ms"></span>
      </div>
      <div class="drag-affordance" aria-hidden="true"></div>
      <div class="content">
        <div class="transcript"></div>
      </div>
      <div class="controls">
        <button class="control snap" type="button" tabindex="-1" aria-label="Snap turn window">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="5.25" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="control discard" type="button" tabindex="-1" aria-label="Discard open turn">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const transcripts = {
        first: 'This is what the turn window looks like right now.',
        append: 'This is what the turn window looks like right now. The voice indicator and open turn now feel like one continuous surface.'
      };
      const phases = new Set(['recording', 'transcribing', 'first', 'append']);
      const scenes = new Set(['dark', 'light', 'busy']);
      let phase = 'recording';
      let scene = 'dark';
      let replayTimers = [];

      const cancelReplay = () => {
        replayTimers.forEach(clearTimeout);
        replayTimers = [];
      };

      document.addEventListener('DOMContentLoaded', () => {
        const stage = document.getElementById('stage');
        const island = stage.querySelector('.island');
        const transcript = stage.querySelector('.transcript');

        const applyPhase = (nextPhase) => {
          if (!phases.has(nextPhase)) return;
          phase = nextPhase;
          stage.classList.remove('phase-recording', 'phase-transcribing', 'phase-first', 'phase-append');
          stage.classList.add(`phase-${phase}`);
          transcript.textContent = transcripts[phase] || '';
        };

        const setPhase = (nextPhase) => {
          cancelReplay();
          applyPhase(nextPhase);
        };

        const setScene = (nextScene) => {
          if (!scenes.has(nextScene)) return;
          scene = nextScene;
          stage.classList.remove('scene-dark', 'scene-light', 'scene-busy');
          stage.classList.add(`scene-${scene}`);
        };

        const replay = () => {
          cancelReplay();
          applyPhase('recording');
          replayTimers = [
            setTimeout(() => applyPhase('transcribing'), 1400),
            setTimeout(() => applyPhase('first'), 2250),
            setTimeout(() => {
              applyPhase('append');
              replayTimers = [];
            }, 3600)
          ];
        };

        const inspect = () => {
          const bounds = island.getBoundingClientRect();
          const controls = stage.querySelector('.controls');
          return {
            concept: 'Liquid Island',
            phase,
            scene,
            islandWidth: Math.round(bounds.width),
            islandHeight: Math.round(bounds.height),
            controlsOpacity: Number.parseFloat(getComputedStyle(controls).opacity),
            transcript: transcript.textContent
          };
        };

        stage.querySelector('.discard').addEventListener('click', () => {
          island.classList.add('discarding');
          setTimeout(() => island.classList.remove('discarding'), 420);
        });

        stage.querySelector('.snap').addEventListener('click', () => {
          island.classList.remove('snapping');
          void island.offsetWidth;
          island.classList.add('snapping');
          setTimeout(() => island.classList.remove('snapping'), 380);
        });

        window.undertonePreview = { setPhase, setScene, replay, inspect };

        const params = new URLSearchParams(location.search);
        applyPhase(phases.has(params.get('phase')) ? params.get('phase') : 'recording');
        setScene(scenes.has(params.get('scene')) ? params.get('scene') : 'dark');
      });
    })();
  </script>
</body>
</html>
